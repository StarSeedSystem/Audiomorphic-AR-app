<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#03060f" />
    <meta name="description" content="Audiomorphic — Visualizador de audio sinestésico con geometría sagrada, realidad virtual y aumentada." />
    <title>Audiomorphic</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      body {
        background-color: #03060f;
        color: #f1f5f9;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #040710;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;
        var isNative =
          window.location.protocol === 'app:' ||
          window.location.protocol === 'file:' ||
          window.location.protocol === 'capacitor:' ||
          Boolean(window.electronAPI) ||
          Boolean(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) ||
          /Electron/i.test(navigator.userAgent);

        if (isNative) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister().catch(function () {}); });
          }).catch(function () {});
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) {
                if (k.indexOf('audiomorphic-') === 0) caches.delete(k).catch(function () {});
              });
            }).catch(function () {});
          }
          return;
        }

        if (window.location.protocol === 'https:') {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('./sw.js').catch(function () {});
          });
        }
      })();
    </script>
  </body>
</html>
